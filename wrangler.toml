name = "short-url"
type = "javascript"
account_id = ""  # 部署时从 CF Dashboard 获取
pages_build_output_dir = "public"
compatibility_date = "2024-01-01"

# Cloudflare Pages KV 命名空间绑定
[[kv_namespaces]]
binding = "URL_STORE"
id = ""  # 替换为实际的 KV namespace ID
preview_id = ""  # 替换为预览环境的 KV namespace ID

# 环境变量
[env.production]
vars = { ENVIRONMENT = "production" }

[[env.production.kv_namespaces]]
binding = "URL_STORE"
id = ""  # 替换为生产环境的 KV namespace ID
