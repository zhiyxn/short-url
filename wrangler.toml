name = "short-url"
compatibility_date = "2024-01-01"

# Cloudflare KV 命名空间绑定
[[kv_namespaces]]
binding = "URL_STORE"
id = ""  # 替换为实际的 KV namespace ID（生产环境）
preview_id = ""  # 替换为预览环境的 KV namespace ID

# 生产环境
[env.production]
vars = { ENVIRONMENT = "production" }

[[env.production.kv_namespaces]]
binding = "URL_STORE"
id = ""  # 替换为生产环境的 KV namespace ID
